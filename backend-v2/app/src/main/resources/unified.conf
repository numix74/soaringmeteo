# Configuration unifiée pour backend-v2
# Format : HOCON (Human-Optimized Config Object Notation)

unified {
  # Région cible (pour sélection zone prédéfinie)
  region = "pays-basque"  # AROME resolution (0.025° ≈ 2.5 km)

  # Sources de données
  # Les pipelines backend/ continuent à télécharger/générer les GRIB
  # backend-v2 lit ces fichiers (lecture seule)
  sources {
    gfs {
      enabled = true
      # Répertoire où backend/gfs télécharge les fichiers GRIB
      grib-directory = "/home/ubuntu/soaringmeteo/output/grib/gfs"
      priority = 3  # Fallback (basse résolution)
      native-resolution = 27.0  # km (~0.25°)
    }

    arome {
      enabled = true
      # Répertoire où backend/arome stocke les fichiers GRIB2
      grib-directory = "/home/ubuntu/soaringmeteo/output/grib/arome/pays_basque"
      # Vents pré-extraits depuis HP1
      winds-directory = "/home/ubuntu/soaringmeteo/output/grib/arome/pays_basque/winds"
      # Profils verticaux pré-extraits
      profiles-directory = "/home/ubuntu/soaringmeteo/output/grib/arome/pays_basque/profiles"
      priority = 1  # Prioritaire (haute résolution locale)
      native-resolution = 2.5  # km
    }

    wrf {
      enabled = false  # Pas utilisé pour Pyrénées initialement
      netcdf-directory = "/home/ubuntu/soaringmeteo/backend/wrf/netcdf"
      priority = 2
      native-resolution = 2.0  # km (valeur par défaut, configurable)
    }
  }

  # Zone géographique cible
  zone {
    id = "pays-basque"
    label = "Pays Basque"
    lon-min = -2.0
    lon-max = 0.5
    lat-min = 42.8
    lat-max = 43.6
    step = 0.025        # AROME native resolution ~2.5 km (100×32 grid)
    # step = 0.25       # GFS native resolution ~27 km (10×3 grid for this zone)
    # step = 0.01       # ~1 km (Phase 7 avec downscaling)
    vector-tile-size = 300

    # Alternative zones (commentées) :
    # Pyrénées complètes (pour GFS):
    # id = "pyrenees"
    # label = "Pyrénées"
    # lon-min = -4.0, lon-max = 3.75
    # lat-min = 42.0, lat-max = 43.5
    # step = 0.25 → 32×7 grid
  }

  # Configuration outputs
  output {
    # Répertoire de base pour tous les outputs
    base-directory = "/home/ubuntu/soaringmeteo/output-unified"
    # Version du format (pour compatibilité frontend)
    format-version = 7

    # Structure des outputs
    # output-unified/
    #   7/
    #     gfs/20251228_00/pyrenees/
    #       maps/0/, maps/1/, ...
    #       location/
    #     arome/20251228_06/pyrenees/
    #       maps/0/, maps/1/, ...
    #       location/
  }

  # Interpolation temporelle
  temporal-interpolation {
    enabled = true
    # Génère des prévisions toutes les heures
    # GFS : H+0, H+3, H+6... → H+0, H+1, H+2, H+3, H+4, H+5, H+6...
    # AROME : déjà toutes les heures → pas d'interpolation
    target-time-step = 1  # heure
  }

  # Downscaling (Phase 7)
  downscaling {
    # Activé seulement si résolution native > 1.1 km
    enabled = false  # À activer en Phase 7
    target-resolution = 1.0  # km
    threshold = 1.1  # km - Downscale seulement si résolution > seuil
    method = "terrain-aware"  # "bilinear" | "terrain-aware" | "ml"
    dem-file = "/data/dem/srtm_pyrenees_1km.tif"

    # Cache DEM en mémoire (évite rechargement)
    cache-dem = true
  }

  # Stratégie de fusion modèles (futur - Phase 5+)
  model-fusion {
    # Ordre de priorité : AROME > WRF > GFS
    # Si AROME disponible, utiliser AROME
    # Sinon si WRF disponible, utiliser WRF
    # Sinon utiliser GFS
    priority-order = ["arome", "wrf", "gfs"]

    # Blending entre modèles (futur)
    # Crée une zone de transition douce entre AROME et GFS
    blending {
      enabled = false  # Désactivé pour Phases 1-4
      overlap-zone-km = 50  # Zone de transition 50km
      method = "linear"  # "linear" | "gaussian"
    }
  }

  # Performance et parallélisme
  processing {
    # Nombre de threads pour traitement parallèle
    parallel-threads = 4

    # Mémoire allouée pour cache grilles
    # Cache évite de reparser les fichiers GRIB pour interpolation
    grid-cache-size = 2  # Nombre de grilles en cache
  }

  # Database H2 pour location forecasts
  h2db {
    url = "jdbc:h2:file:./unified-data"
    driver = "org.h2.Driver"
    connection-pool-size = 10
  }

  # Logging
  logging {
    level = "INFO"  # "DEBUG" | "INFO" | "WARN" | "ERROR"
    # Log détaillé pour debugging
    log-interpolation = false
    log-downscaling = false
  }
}

# Override pour environnement développement
# Charge avec : ConfigFactory.load("unified.conf").withFallback(ConfigFactory.load("dev"))
dev {
  unified {
    output {
      base-directory = "/home/ubuntu/soaringmeteo/backend-v2/target/output-unified"
    }

    sources {
      # En dev, utiliser fichiers GRIB locaux (production paths)
      gfs {
        grib-directory = "/home/ubuntu/soaringmeteo/output/grib/gfs"
      }
      arome {
        grib-directory = "/home/ubuntu/soaringmeteo/output/grib/arome/pays_basque"
      }
    }

    logging {
      level = "DEBUG"
      log-interpolation = true
    }
  }
}

# Override pour production
prod {
  unified {
    output {
      base-directory = "/home/ubuntu/soaringmeteo/output-unified"
    }

    processing {
      parallel-threads = 8  # Plus de threads en production
    }

    logging {
      level = "INFO"
    }
  }
}
